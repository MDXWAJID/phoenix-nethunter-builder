name: Build Poco X2 NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev libelf-dev \
            liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi libssl-dev

      - name: Clone Kernel Source & AnyKernel3
        run: |
          git clone https://github.com/PixelExperience-Devices/kernel_xiaomi_phoenix.git -b twelve kernel --depth=1
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3

      - name: Fetch Proton Clang Toolchain
        run: |
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 clang

      - name: Configure and Compile Kernel
        run: |
          cd kernel
          export PATH=$(pwd)/../clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export HEADER_ARCH=arm64

          # Locate defconfig
          if [ -f "arch/arm64/configs/vendor/phoenix_defconfig" ]; then
            DEFCONFIG="vendor/phoenix_defconfig"
          elif [ -f "arch/arm64/configs/phoenix_defconfig" ]; then
            DEFCONFIG="phoenix_defconfig"
          elif [ -f "arch/arm64/configs/vendor/phoenix-perf_defconfig" ]; then
            DEFCONFIG="vendor/phoenix-perf_defconfig"
          else
            DEFCONFIG=$(find arch/arm64/configs/ -name "*phoenix*" | head -n 1 | sed 's|arch/arm64/configs/||')
          fi

          echo "Target defconfig: $DEFCONFIG"

          # 1. Generate base configuration
          make O=out ARCH=arm64 $DEFCONFIG

          # 2. Inject NetHunter & ath9k drivers directly as built-in (=y)
          ./scripts/config --file out/.config \
            -e CONFIG_IKCONFIG \
            -e CONFIG_IKCONFIG_PROC \
            -e CONFIG_KPROBES \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_CFG80211 \
            -e CONFIG_CFG80211_WEXT \
            -e CONFIG_MAC80211 \
            -e CONFIG_MAC80211_HAS_RC \
            -e CONFIG_MAC80211_RC_MINSTREL \
            -e CONFIG_MAC80211_RC_MINSTREL_HT \
            -e CONFIG_MAC80211_LEDS \
            -e CONFIG_LEDS_TRIGGERS \
            -e CONFIG_ATH_COMMON \
            -e CONFIG_ATH9K_HW \
            -e CONFIG_ATH9K_COMMON \
            -e CONFIG_ATH9K_HTC \
            -e CONFIG_ATH9K_HTC_DEBUGFS \
            -e CONFIG_USB_GADGET \
            -e CONFIG_USB_CONFIGFS \
            -e CONFIG_USB_CONFIGFS_F_HID \
            -e CONFIG_USB_CONFIGFS_F_RNDIS \
            -e CONFIG_USB_CONFIGFS_F_MASS_STORAGE \
            -d CONFIG_DEBUG_SECTION_MISMATCH

          # 3. Synchronize config options
          make O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- olddefconfig

          # 4. Build Kernel Image and DTBs
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip

      - name: Package with AnyKernel3
        run: |
          # Detect output image location
          IMAGE_PATH=""
          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            IMAGE_PATH="kernel/out/arch/arm64/boot/Image.gz-dtb"
          elif [ -f kernel/out/arch/arm64/boot/Image-dtb ]; then
            IMAGE_PATH="kernel/out/arch/arm64/boot/Image-dtb"
          elif [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            IMAGE_PATH="kernel/out/arch/arm64/boot/Image.gz"
          elif [ -f kernel/out/arch/arm64/boot/Image ]; then
            IMAGE_PATH="kernel/out/arch/arm64/boot/Image"
          fi

          if [ -z "$IMAGE_PATH" ]; then
            echo "Error: No kernel image file found in out directory!"
            exit 1
          fi

          echo "Using kernel image: $IMAGE_PATH"
          cp "$IMAGE_PATH" AnyKernel3/Image.gz-dtb || cp "$IMAGE_PATH" AnyKernel3/

          # Copy dtbo image if built
          if [ -f kernel/out/arch/arm64/boot/dtbo.img ]; then
            cp kernel/out/arch/arm64/boot/dtbo.img AnyKernel3/dtbo.img
          fi

          # Setup AnyKernel3 packaging script for Poco X2 (phoenix)
          cd AnyKernel3
          sed -i 's/is_slot_device=auto;/is_slot_device=0;/g' anykernel.sh
          sed -i 's/block=auto;/block=\/dev\/block\/bootdevice\/by-name\/boot;/g' anykernel.sh
          
          rm -rf .git
          zip -r9 ../NetHunter-Kernel-Phoenix-PE12.zip *

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Kernel-Phoenix-PE12
          path: NetHunter-Kernel-Phoenix-PE12.zip
