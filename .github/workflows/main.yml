name: Build Poco X2 NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev clang lld llvm

      - name: Clone Kernel Source & AnyKernel3
        run: |
          git clone https://github.com/PixelExperience-Devices/kernel_xiaomi_phoenix.git -b twelve kernel --depth=1
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3

      - name: Fetch Proton Clang Toolchain
        run: |
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 clang

      - name: Configure NetHunter Flags
        run: |
          cd kernel
          
          # Determine active defconfig path
          if [ -f "arch/arm64/configs/vendor/phoenix_defconfig" ]; then
            DEFCONFIG_PATH="arch/arm64/configs/vendor/phoenix_defconfig"
          else
            DEFCONFIG_PATH="arch/arm64/configs/phoenix_defconfig"
          fi
          
          # Use kernel config script to prevent symbol conflicts
          ./scripts/config --file $DEFCONFIG_PATH \
            --enable CONFIG_IKCONFIG \
            --enable CONFIG_IKCONFIG_PROC \
            --enable CONFIG_KPROBES \
            --enable CONFIG_BPF_SYSCALL \
            --enable CONFIG_CFG80211 \
            --enable CONFIG_CFG80211_WEXT \
            --enable CONFIG_MAC80211 \
            --enable CONFIG_MAC80211_HAS_RC \
            --enable CONFIG_MAC80211_RC_MINSTREL \
            --enable CONFIG_MAC80211_RC_MINSTREL_HT \
            --enable CONFIG_ATH_COMMON \
            --enable CONFIG_ATH9K_HW \
            --enable CONFIG_ATH9K_COMMON \
            --module CONFIG_ATH9K_HTC \
            --enable CONFIG_USB_GADGET \
            --enable CONFIG_USB_CONFIGFS \
            --enable CONFIG_USB_CONFIGFS_F_HID \
            --enable CONFIG_USB_CONFIGFS_F_RNDIS \
            --enable CONFIG_USB_CONFIGFS_F_MASS_STORAGE

      - name: Compile Kernel
        run: |
          cd kernel
          export PATH=$(pwd)/../clang/bin:$PATH
          
          # Target configuration target name
          if [ -f "arch/arm64/configs/vendor/phoenix_defconfig" ]; then
            CONFIG_NAME="vendor/phoenix_defconfig"
          else
            CONFIG_NAME="phoenix_defconfig"
          fi

          make O=out ARCH=arm64 $CONFIG_NAME
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1

      - name: Package with AnyKernel3
        run: |
          # Locate generated kernel image
          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
          elif [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
          elif [ -f kernel/out/arch/arm64/boot/Image ]; then
            cp kernel/out/arch/arm64/boot/Image AnyKernel3/Image
          fi

          # Copy dtbo image if built
          if [ -f kernel/out/arch/arm64/boot/dtbo.img ]; then
            cp kernel/out/arch/arm64/boot/dtbo.img AnyKernel3/dtbo.img
          fi

          cd AnyKernel3
          sed -i 's/is_slot_device=auto;/is_slot_device=0;/g' anykernel.sh
          sed -i 's/block=auto;/block=\/dev\/block\/bootdevice\/by-name\/boot;/g' anykernel.sh
          
          rm -rf .git
          zip -r9 ../NetHunter-Kernel-Phoenix-PE12.zip *

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Kernel-Phoenix-PE12
          path: NetHunter-Kernel-Phoenix-PE12.zip
