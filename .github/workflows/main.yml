name: Build Poco X2 NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git \
            gnupg gperf libelf-dev liblz4-tool libncurses5-dev libssl-dev libxml2 \
            libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc \
            zip zlib1g-dev python3 wget ca-certificates

      - name: Clone Kernel Source & AnyKernel3
        run: |
          git clone https://github.com/PixelExperience-Devices/kernel_xiaomi_phoenix.git -b twelve kernel --depth=1
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3

      - name: Fetch Proton Clang Toolchain
        run: |
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 clang

      - name: Apply ath9k / QCA HTC collision fix
        run: |
          set -e
          cd kernel

          # 1) Prefix-rename ath9k HTC exports so they cannot collide with qca-wifi-host-cmn
          HTC_H="drivers/net/wireless/ath/ath9k/htc.h"
          if [ -f "$HTC_H" ]; then
            # Insert renames once, after the include guard
            grep -q 'ath9k_htc_stop' "$HTC_H" || sed -i '/#define HTC_H/a \
\
/* NetHunter: avoid multiple definition with qca-wifi-host-cmn HTC */\
#define htc_stop                     ath9k_htc_stop\
#define htc_start                    ath9k_htc_start\
#define htc_init                     ath9k_htc_init\
#define htc_cleanup                  ath9k_htc_cleanup\
#define htc_connect_service          ath9k_htc_connect_service\
#define htc_connect_service_complete ath9k_htc_connect_service_complete\
#define htc_send                     ath9k_htc_send\
#define htc_send_epid                ath9k_htc_send_epid\
#define htc_tx_completion            ath9k_htc_tx_completion\
#define htc_rx_completion            ath9k_htc_rx_completion\
#define htc_credit_distribution      ath9k_htc_credit_distribution\
#define htc_setup_credit             ath9k_htc_setup_credit\
' "$HTC_H"
          fi

          # 2) If htc_hst.c still exports un-prefixed globals, force static on internal helpers
          #    (only touches ath9k copy)
          if [ -f drivers/net/wireless/ath/ath9k/htc_hst.c ]; then
            # nothing else required when header renames cover the ld errors
            true
          fi

          # 3) Silence known harmless noise (optional)
          # smb1390 cast warning — leave as-is; does not fail link

      - name: Configure and Compile Kernel
        run: |
          set -e
          cd kernel
          export PATH=$(pwd)/../clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export HEADER_ARCH=arm64
          export KCFLAGS="-Wno-error"
          export KBUILD_CFLAGS="-Wno-error"

          if [ -f "arch/arm64/configs/vendor/phoenix_defconfig" ]; then
            DEFCONFIG="vendor/phoenix_defconfig"
          elif [ -f "arch/arm64/configs/phoenix_defconfig" ]; then
            DEFCONFIG="phoenix_defconfig"
          elif [ -f "arch/arm64/configs/vendor/phoenix-perf_defconfig" ]; then
            DEFCONFIG="vendor/phoenix-perf_defconfig"
          else
            DEFCONFIG=$(find arch/arm64/configs/ -name "*phoenix*" | head -n 1 | sed 's|arch/arm64/configs/||')
          fi
          echo "Target defconfig: $DEFCONFIG"

          make O=out ARCH=arm64 $DEFCONFIG

          # NetHunter + USB monitor + external Wi‑Fi
          # NOTE: do NOT disable QCA; only ath9k side is renamed above
          ./scripts/config --file out/.config \
            -e CONFIG_IKCONFIG \
            -e CONFIG_IKCONFIG_PROC \
            -e CONFIG_KPROBES \
            -e CONFIG_HAVE_KPROBES \
            -e CONFIG_BPF \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_BPF_JIT \
            -e CONFIG_CFG80211 \
            -e CONFIG_CFG80211_WEXT \
            -e CONFIG_MAC80211 \
            -e CONFIG_MAC80211_HAS_RC \
            -e CONFIG_MAC80211_RC_MINSTREL \
            -e CONFIG_MAC80211_RC_MINSTREL_HT \
            -e CONFIG_MAC80211_LEDS \
            -e CONFIG_LEDS_TRIGGERS \
            -e CONFIG_ATH_COMMON \
            -e CONFIG_ATH9K_HW \
            -e CONFIG_ATH9K_COMMON \
            -e CONFIG_ATH9K_BTCOEX_SUPPORT \
            -e CONFIG_ATH9K_HTC \
            -e CONFIG_ATH9K_HTC_DEBUGFS \
            -e CONFIG_USB \
            -e CONFIG_USB_SUPPORT \
            -e CONFIG_USB_GADGET \
            -e CONFIG_USB_CONFIGFS \
            -e CONFIG_USB_CONFIGFS_F_HID \
            -e CONFIG_USB_CONFIGFS_F_RNDIS \
            -e CONFIG_USB_CONFIGFS_F_MASS_STORAGE \
            -e CONFIG_USB_ETH \
            -e CONFIG_USB_FUNCTIONFS \
            -e CONFIG_PACKET \
            -e CONFIG_RFKILL \
            -m CONFIG_RTL8187 \
            -m CONFIG_RTL8XXXU \
            -m CONFIG_MEDIA_DIGITAL_TV_SUPPORT \
            -e CONFIG_CFG80211_WEXT

          # Prefer modules for USB wifi stacks when possible (reduces vmlinux clashes)
          ./scripts/config --file out/.config \
            --module CONFIG_ATH9K_HTC || true

          make O=out ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig

          # Build; -Wno-error keeps unused-label / void*-cast warnings from becoming errors
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            KCFLAGS="-Wno-error" \
            2>&1 | tee ../build.log

      - name: Collect modules (ath9k_htc etc.)
        run: |
          set -e
          cd kernel
          mkdir -p ../mods
          # Install modules into a temp tree if modules were built
          make O=out ARCH=arm64 INSTALL_MOD_PATH=$(pwd)/../mods_install modules_install || true
          find out -name 'ath9k_htc.ko' -exec cp {} ../mods/ \; || true
          find out -name 'ath*.ko' -exec cp {} ../mods/ \; || true
          find ../mods_install -name '*.ko' -path '*/ath/*' -exec cp {} ../mods/ \; 2>/dev/null || true
          ls -la ../mods || true

      - name: Package with AnyKernel3
        run: |
          set -e
          IMAGE_PATH=""
          for cand in \
            kernel/out/arch/arm64/boot/Image.gz-dtb \
            kernel/out/arch/arm64/boot/Image-dtb \
            kernel/out/arch/arm64/boot/Image.gz \
            kernel/out/arch/arm64/boot/Image
          do
            if [ -f "$cand" ]; then IMAGE_PATH="$cand"; break; fi
          done

          if [ -z "$IMAGE_PATH" ]; then
            echo "ERROR: no kernel image"
            ls -laR kernel/out/arch/arm64/boot || true
            # dump last link errors for debug
            tail -n 80 build.log || true
            exit 1
          fi

          echo "Using kernel image: $IMAGE_PATH"
          cp "$IMAGE_PATH" AnyKernel3/Image.gz-dtb 2>/dev/null || cp "$IMAGE_PATH" AnyKernel3/

          if [ -f kernel/out/arch/arm64/boot/dtbo.img ]; then
            cp kernel/out/arch/arm64/boot/dtbo.img AnyKernel3/dtbo.img
          fi

          # ship external wifi modules next to the zip payload
          mkdir -p AnyKernel3/modules/system/lib/modules
          cp mods/*.ko AnyKernel3/modules/system/lib/modules/ 2>/dev/null || true

          cd AnyKernel3
          # Phoenix (non-A/B style boot)
          sed -i 's/is_slot_device=auto;/is_slot_device=0;/g' anykernel.sh
          sed -i 's|block=auto;|block=/dev/block/bootdevice/by-name/boot;|g' anykernel.sh

          # Ensure anykernel copies Image correctly
          grep -q 'Image.gz-dtb' anykernel.sh || true

          rm -rf .git
          zip -r9 ../NetHunter-Kernel-Phoenix-PE12.zip *

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Kernel-Phoenix-PE12
          path: NetHunter-Kernel-Phoenix-PE12.zip

      - name: Upload build log on failure path
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
