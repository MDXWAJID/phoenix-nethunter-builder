name: Build Poco X2 NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git \
            gnupg gperf libelf-dev liblz4-tool libncurses5-dev libssl-dev libxml2 \
            libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc \
            zip zlib1g-dev python3 wget ca-certificates

      - name: Fix python2 for legacy kernel build
        run: |
          # The kernel build calls "python2" explicitly for dtbo generation
          sudo ln -sf /usr/bin/python3 /usr/bin/python2

      - name: Clone Kernel Source and AnyKernel3
        run: |
          git clone https://github.com/PixelExperience-Devices/kernel_xiaomi_phoenix.git -b twelve kernel --depth=1
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3

      - name: Fetch Proton Clang Toolchain
        run: |
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 clang

      - name: Patch Python 3 compatibility for DTC scripts
        run: |
          set -e
          # The PE twelve tree still carries Python 2 syntax in its DTC helper scripts.
          # Ubuntu 22.04 runs Python 3, so we patch all known Py2-isms before compilation.
          find kernel/scripts -name "*.py" -print0 | while IFS= read -r -d '' f; do
            sed -i 's/xrange/range/g' "$f"
            sed -i 's/if version is 0:/if version == 0:/g' "$f"
            sed -i 's/if version is not 0:/if version != 0:/g' "$f"
          done

          # FIX: mkdtboimg.py initializes dt_entry_buf as a str ("") but later
          # concatenates bytes (compressed_entry) onto it, causing:
          # TypeError: can only concatenate str (not "bytes") to str
          # Force it to start as a bytes object instead.
          sed -i 's/dt_entry_buf = ""/dt_entry_buf = b""/' kernel/scripts/dtc/libfdt/mkdtboimg.py

          # FIX: _update_metadata() builds the header buffer using
          # array('c', ' ' * size) — the 'c' typecode (byte string) was
          # removed from Python's array module in Python 3, causing:
          # TypeError: cannot use a str to initialize an array with typecode 'c'
          # A bytearray behaves the same way for struct.pack_into() and
          # file.write(), so swap it in directly.
          sed -i "s/self.__metadata = array('c', ' ' \* self.__metadata_size)/self.__metadata = bytearray(self.__metadata_size)/" kernel/scripts/dtc/libfdt/mkdtboimg.py

          # Verify the known fatal file is clean
          if grep -q 'xrange' kernel/scripts/dtc/libfdt/mkdtboimg.py; then
            echo "ERROR: Failed to patch xrange in mkdtboimg.py"
            exit 1
          fi
          if grep -q 'dt_entry_buf = ""' kernel/scripts/dtc/libfdt/mkdtboimg.py; then
            echo "ERROR: Failed to patch dt_entry_buf bytes fix in mkdtboimg.py"
            exit 1
          fi
          if grep -q "array('c'" kernel/scripts/dtc/libfdt/mkdtboimg.py; then
            echo "ERROR: Failed to patch array('c', ...) bytearray fix in mkdtboimg.py"
            exit 1
          fi
          echo "Python DTC scripts patched for Python 3"

      - name: Apply ath9k HTC symbol rename fix
        run: |
          set -e
          cd kernel
          HTC_H="drivers/net/wireless/ath/ath9k/htc.h"
          if [ ! -f "$HTC_H" ]; then
            echo "ERROR: htc.h not found"
            exit 1
          fi
          if grep -q "ath9k_htc_stop" "$HTC_H"; then
            echo "Rename patch already present"
          else
            cat > /tmp/ath9k_htc_rename.h << 'EOF'
          /* NetHunter: avoid multiple definition with qca-wifi-host-cmn HTC */
          #define htc_stop                     ath9k_htc_stop
          #define htc_start                    ath9k_htc_start
          #define htc_init                     ath9k_htc_init
          #define htc_cleanup                  ath9k_htc_cleanup
          #define htc_connect_service          ath9k_htc_connect_service
          #define htc_connect_service_complete ath9k_htc_connect_service_complete
          #define htc_send                     ath9k_htc_send
          #define htc_send_epid                ath9k_htc_send_epid
          #define htc_tx_completion            ath9k_htc_tx_completion
          #define htc_rx_completion            ath9k_htc_rx_completion
          #define htc_credit_distribution      ath9k_htc_credit_distribution
          #define htc_setup_credit             ath9k_htc_setup_credit
          EOF
            awk '1; /#define HTC_H/{system("cat /tmp/ath9k_htc_rename.h")}' "$HTC_H" > /tmp/htc_h_new
            mv /tmp/htc_h_new "$HTC_H"
            echo "Patched $HTC_H"
          fi
          head -n 40 "$HTC_H"

      - name: Fix ufshcd duplicate symbol linker error
        run: |
          set -e
          cd kernel
          UFS_MK="drivers/scsi/ufs/Makefile"
          if [ ! -f "$UFS_MK" ]; then
            echo "ERROR: $UFS_MK not found"
            exit 1
          fi
          # This tree's Makefile builds ufshcd.c twice: once wrapped into
          # ufshcd-core.o (via "ufshcd-core-y := ufshcd.o"), and again as a
          # standalone "ufshcd.o" object. Both end up built-in, so ld.lld
          # fails with "duplicate symbol" for every function in ufshcd.c.
          # Fix: drop the redundant standalone line, keep the composite one.
          if grep -qE '^obj-\$\(CONFIG_SCSI_UFSHCD\) \+= ufshcd\.o$' "$UFS_MK"; then
            sed -i '/^obj-\$(CONFIG_SCSI_UFSHCD) += ufshcd\.o$/d' "$UFS_MK"
            echo "Removed duplicate 'ufshcd.o' obj-y line from $UFS_MK"
          else
            echo "Duplicate line not found (already patched or upstream changed) - skipping"
          fi
          cat "$UFS_MK"

      - name: Configure Kernel
        run: |
          set -e
          cd kernel
          export PATH="$(pwd)/../clang/bin:$PATH"

          # PE twelve places the defconfig under vendor/
          DEFCONFIG="vendor/phoenix_defconfig"
          echo "Target defconfig: $DEFCONFIG"

          make O=out ARCH=arm64 "$DEFCONFIG"

          # Enable NetHunter-specific options
          ./scripts/config --file out/.config \
            -e CONFIG_IKCONFIG \
            -e CONFIG_IKCONFIG_PROC \
            -e CONFIG_KPROBES \
            -e CONFIG_HAVE_KPROBES \
            -e CONFIG_BPF \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_BPF_JIT \
            -e CONFIG_CFG80211 \
            -e CONFIG_CFG80211_WEXT \
            -e CONFIG_MAC80211 \
            -e CONFIG_MAC80211_HAS_RC \
            -e CONFIG_MAC80211_RC_MINSTREL \
            -e CONFIG_MAC80211_RC_MINSTREL_HT \
            -e CONFIG_MAC80211_LEDS \
            -e CONFIG_LEDS_TRIGGERS \
            -e CONFIG_ATH_COMMON \
            -e CONFIG_ATH9K_HW \
            -e CONFIG_ATH9K_COMMON \
            -e CONFIG_ATH9K_BTCOEX_SUPPORT \
            -e CONFIG_ATH9K_HTC \
            -e CONFIG_ATH9K_HTC_DEBUGFS \
            -e CONFIG_USB \
            -e CONFIG_USB_SUPPORT \
            -e CONFIG_USB_GADGET \
            -e CONFIG_USB_CONFIGFS \
            -e CONFIG_USB_CONFIGFS_F_HID \
            -e CONFIG_USB_CONFIGFS_F_RNDIS \
            -e CONFIG_USB_CONFIGFS_F_MASS_STORAGE \
            -e CONFIG_USB_ETH \
            -e CONFIG_USB_FUNCTIONFS \
            -e CONFIG_PACKET \
            -e CONFIG_RFKILL

          # Build ath9k_htc as a loadable module
          ./scripts/config --file out/.config --module CONFIG_ATH9K_HTC || true

          make O=out ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            olddefconfig

          # FIX: olddefconfig re-validates the whole config and can silently
          # reset options set above if it thinks a dependency isn't satisfied
          # yet - no error, it just disappears. That's what ate ATH9K_HTC
          # last time and produced a zip with zero WiFi modules. Reassert it
          # here, AFTER olddefconfig, so it's the last word on the config.
          ./scripts/config --file out/.config --module CONFIG_ATH9K_HTC
          ./scripts/config --file out/.config -e CONFIG_ATH9K_COMMON -e CONFIG_ATH9K_HW -e CONFIG_ATH_COMMON

          echo "=== Final ATH9K_HTC config state (must show =m) ==="
          grep -E "CONFIG_ATH9K_HTC=|CONFIG_ATH9K_COMMON=|CONFIG_ATH9K_HW=|CONFIG_ATH_COMMON=" out/.config
          if ! grep -q "^CONFIG_ATH9K_HTC=m" out/.config; then
            echo "ERROR: CONFIG_ATH9K_HTC did not stick as a module. Aborting before a silent-fail build."
            exit 1
          fi

      - name: Compile Kernel
        run: |
          set -e
          set -o pipefail
          cd kernel
          export PATH="$(pwd)/../clang/bin:$PATH"

          # Explicit targets: Image.gz-dtb (kernel+dtb), dtbo.img (overlay),
          # and modules (builds every =m driver, including ath9k_htc.ko).
          # Without "modules" here, anything set to =m in .config is silently
          # never compiled - the config being right means nothing on its own.
          # LD=ld.lld is required because Proton Clang does not ship GNU ld
          make -j"$(nproc --all)" O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            KCFLAGS="-Wno-error" \
            Image.gz-dtb dtbo.img modules \
            2>&1 | tee ../build.log

          echo "=== Build outputs ==="
          ls -la out/arch/arm64/boot/

      - name: Verify Kernel Outputs
        run: |
          set -e
          cd kernel

          if [ ! -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "ERROR: Kernel image (Image.gz-dtb) was not built."
            echo "Dumping last 30 fatal lines from build.log:"
            grep -n -E "make\[*]: \*\*\*|error:|Error [0-9]+|NameError|SyntaxError|fatal error:" ../build.log | tail -30
            exit 1
          fi

          if [ ! -f out/arch/arm64/boot/dtbo.img ]; then
            echo "ERROR: dtbo.img was not built."
            echo "Dumping last 30 fatal lines from build.log:"
            grep -n -E "make\[*]: \*\*\*|error:|Error [0-9]+|NameError|SyntaxError|fatal error:" ../build.log | tail -30
            exit 1
          fi

          echo "Kernel image and dtbo.img built successfully."

      - name: Collect Modules
        run: |
          set -e
          cd kernel
          mkdir -p ../mods

          make O=out ARCH=arm64 INSTALL_MOD_PATH="$(pwd)/../mods_install" modules_install || true

          find out ../mods_install -name 'ath9k_htc.ko' -exec cp -v {} ../mods/ \; 2>/dev/null || true
          find out ../mods_install -name 'ath*.ko' -exec cp -v {} ../mods/ \; 2>/dev/null || true

          echo "=== Modules actually collected ==="
          ls -la ../mods/*.ko 2>/dev/null || echo "(none)"

          if [ -z "$(ls -A ../mods/*.ko 2>/dev/null)" ]; then
            echo "ERROR: No .ko modules were collected - the zip would ship with no WiFi driver."
            echo "Dumping every .ko produced anywhere in the build tree for diagnosis:"
            find out ../mods_install -name '*.ko' 2>/dev/null | head -50
            exit 1
          fi

          ls -la ../mods || true

      - name: Package with AnyKernel3
        run: |
          set -e

          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cp kernel/out/arch/arm64/boot/dtbo.img AnyKernel3/

          mkdir -p AnyKernel3/modules/system/lib/modules
          cp mods/*.ko AnyKernel3/modules/system/lib/modules/ 2>/dev/null || true

          cd AnyKernel3
          # FIX: sed patterns below never matched the real file (wrong case/text),
          # so the previous zip shipped with Galaxy Nexus template values.
          # do.devicecheck=1 + device.name1=maguro etc. means the installer
          # refuses to flash on phoenix. Disable the check entirely.
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' anykernel.sh

          # FIX: verified by reading tools/ak3-core.sh directly - module
          # installation (copying ath9k_htc.ko etc. onto the device) is
          # gated entirely on do.modules=1. Template default is 0, which
          # means the .ko files ride along in the zip but never get
          # installed. This is the actual point of this whole build, so
          # flip it on.
          sed -i 's/do.modules=0/do.modules=1/' anykernel.sh

          # BLOCK= still pointed at the OMAP (Galaxy Nexus) template path.
          # Replace with phoenix's actual boot partition path.
          sed -i 's|^BLOCK=.*;|BLOCK=/dev/block/bootdevice/by-name/boot;|' anykernel.sh

          # CRITICAL FIX: the boot install section below the properties block
          # still had example ramdisk-patching code for the Galaxy Nexus
          # ("tuna") - touching init.tuna.rc and fstab.tuna, files that don't
          # exist on phoenix. This never got adapted for the real device and
          # caused a bootloop. Strip it out entirely; phoenix's kernel swap
          # needs nothing beyond dump_boot / write_boot.
          sed -i '/^# init\.rc$/,/^write_boot;/{ /^write_boot;/!d }' anykernel.sh

          if grep -q "init.tuna.rc\|fstab.tuna" anykernel.sh; then
            echo "ERROR: leftover tuna ramdisk-patch lines still present after strip"
            exit 1
          fi

          echo "=== boot install section after strip ==="
          sed -n '/# boot install/,/## end boot install/p' anykernel.sh

          # phoenix is not an A/B slot device, so IS_SLOT_DEVICE=0 (already
          # the template default) is correct as-is - no change needed there.

          # Verify both patches actually landed before zipping
          if ! grep -q '^do.devicecheck=0' anykernel.sh; then
            echo "ERROR: devicecheck patch failed to apply"
            exit 1
          fi
          if ! grep -q '^do.modules=1' anykernel.sh; then
            echo "ERROR: do.modules patch failed to apply - modules would be dead weight in the zip"
            exit 1
          fi
          if ! grep -q '^BLOCK=/dev/block/bootdevice/by-name/boot;' anykernel.sh; then
            echo "ERROR: BLOCK path patch failed to apply"
            exit 1
          fi
          echo "anykernel.sh patched correctly:"
          grep -E "do.devicecheck|do.modules|^BLOCK=|IS_SLOT_DEVICE" anykernel.sh

          rm -rf .git
          zip -r9 ../NetHunter-Kernel-Phoenix-PE12.zip *

      - name: Upload Flashable Zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Kernel-Phoenix-PE12
          path: NetHunter-Kernel-Phoenix-PE12.zip

      - name: Debug Summary
        if: always()
        run: |
          {
            echo "=== BOOT IMAGE FILES ==="
            ls -la kernel/out/arch/arm64/boot/ 2>&1 || echo "(kernel/out/arch/arm64/boot/ missing)"
            echo ""
            echo "=== ATH9K CONFIG STATE ==="
            grep -E "CONFIG_ATH9K_HTC=|CONFIG_ATH9K_COMMON=|CONFIG_ATH9K_HW=|CONFIG_ATH_COMMON=" kernel/out/.config 2>&1 || echo "(.config missing)"
            echo ""
            echo "=== MODULES COLLECTED ==="
            ls -la mods/*.ko 2>&1 || echo "(no mods collected)"
            echo ""
            echo "=== ANY .ko ANYWHERE IN BUILD TREE ==="
            find kernel/out -name '*.ko' 2>&1 | head -30 || echo "(none found)"
            echo ""
            echo "=== FINAL ZIP CONTENTS ==="
            unzip -l NetHunter-Kernel-Phoenix-PE12.zip 2>&1 || echo "(zip was never created)"
            echo ""
            echo "=== anykernel.sh KEY LINES ==="
            grep -E "do.devicecheck|do.modules|^BLOCK=|IS_SLOT_DEVICE" AnyKernel3/anykernel.sh 2>&1 || echo "(anykernel.sh missing)"
          } > debug-summary.log 2>&1
          cat debug-summary.log

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            debug-summary.log
          if-no-files-found: warn
