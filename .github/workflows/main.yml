name: NetHunter Kernel — Poco X2 (MIUI 12.5.6 / Android 11)

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Kernel source repository'
        required: true
        default: 'https://github.com/Hycon-Devices/kernel_xiaomi_phoenix.git'
      kernel_branch:
        description: 'Kernel branch'
        required: true
        default: '11'
      defconfig:
        description: 'Defconfig name'
        required: true
        default: 'phoenix_defconfig'
      localversion:
        description: 'Kernel LOCALVERSION suffix'
        required: true
        default: '-perf-NetHunter-v1'
      build_type:
        description: 'Build type'
        type: choice
        options:
          - clean
          - incremental
        default: 'clean'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      # ─────────────────────────────────────────────
      # 1. Free disk space
      # ─────────────────────────────────────────────
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f
          sudo apt-get clean

      # ─────────────────────────────────────────────
      # 2. Install build dependencies + GCC 10 cross-compilers
      # ─────────────────────────────────────────────
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git ccache automake flex lzop bison gperf build-essential zip curl \
            zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 \
            squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng bc \
            libstdc++6 libncurses5 wget python3 python3-pip gcc clang libssl-dev \
            rsync flex bison aria2 libelf-dev libncurses-dev libffi-dev libyaml-dev \
            device-tree-compiler libcap-dev \
            gcc-10-aarch64-linux-gnu gcc-10-arm-linux-gnueabihf \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabihf

      # ─────────────────────────────────────────────
      # 3. Clone kernel source
      # ─────────────────────────────────────────────
      - name: Clone kernel source
        run: |
          git clone --depth=1 -b ${{ inputs.kernel_branch }} ${{ inputs.kernel_repo }} kernel
          cd kernel
          echo "KERNEL_PATH=$(pwd)" >> $GITHUB_ENV

      # ─────────────────────────────────────────────
      # 4. CRITICAL: Patch source before build
      # ─────────────────────────────────────────────
      - name: Pre-build source patches
        run: |
          cd $KERNEL_PATH

          # FATAL FIX #1: dtbo.img generation hardcodes python2. Redirect to python3.
          sed -i 's/python2/python3/g' arch/arm64/boot/Makefile
          echo "✓ Patched arch/arm64/boot/Makefile: python2 -> python3"

          # Fix SECTOR_SIZE redefinition in dm-bow.c
          sed -i '/^#define SECTOR_SIZE 512$/d' drivers/md/dm-bow.c

          # Fix strlcpy destination size in sdio_cis.c
          sed -i 's|strlcpy(string, buf, strlen(buf) + 1);|strlcpy(string, buf, sizeof(string));|' drivers/mmc/core/sdio_cis.c

          # Fix snprintf buffer overruns in nt36672c touchscreen driver
          sed -i 's|snprintf(mp_setting_criteria_csv_filename, PAGE_SIZE|snprintf(mp_setting_criteria_csv_filename, sizeof(mp_setting_criteria_csv_filename)|g' drivers/input/touchscreen/nt36672c/nt36xxx_mp_ctrlram.c
          sed -i 's|snprintf(mpcriteria, PAGE_SIZE|snprintf(mpcriteria, sizeof(mpcriteria)|g' drivers/input/touchscreen/nt36672c/nt36xxx_mp_ctrlram.c

          # Fix unused variables in zram_drv.c
          sed -i '/char mode_buf\[8\];/d' drivers/block/zram/zram_drv.c
          sed -i 's|ssize_t ret = len, sz;|ssize_t ret = len;|' drivers/block/zram/zram_drv.c

      # ─────────────────────────────────────────────
      # 5. Validate defconfig exists
      # ─────────────────────────────────────────────
      - name: Validate defconfig
        run: |
          cd $KERNEL_PATH
          if [ ! -f "arch/arm64/configs/${{ inputs.defconfig }}" ]; then
            echo "✗ defconfig NOT FOUND: arch/arm64/configs/${{ inputs.defconfig }}"
            find arch/arm64/configs/ -name "*defconfig*" | sort
            exit 1
          fi
          echo "✓ defconfig FOUND"

      # ─────────────────────────────────────────────
      # 6. Setup gcc-wrapper.py (transparent pass-through)
      # ─────────────────────────────────────────────
      - name: Setup gcc-wrapper.py
        run: |
          cd $KERNEL_PATH
          cat > scripts/gcc-wrapper.py << 'PYEOF'
          #!/usr/bin/env python3
          import sys
          import subprocess

          def main():
              args = sys.argv[1:]
              if not args:
                  return 1
              proc = subprocess.Popen(args, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              stdout, stderr = proc.communicate()
              sys.stdout.buffer.write(stdout)
              sys.stderr.buffer.write(stderr)
              return proc.returncode

          if __name__ == '__main__':
              sys.exit(main())
          PYEOF
          chmod +x scripts/gcc-wrapper.py
          python3 -m py_compile scripts/gcc-wrapper.py && echo "✓ gcc-wrapper.py OK" || exit 1

      # ─────────────────────────────────────────────
      # 7. Setup toolchain — GCC 10 cross-compiler
      #    Symlink Ubuntu's gcc-10 as the Android-named toolchain
      # ─────────────────────────────────────────────
      - name: Setup toolchain
        run: |
          mkdir -p $HOME/toolchain/gcc10/bin
          cd $HOME/toolchain/gcc10/bin

          # AArch64 — GCC 10 supports cortex-a76 natively
          ln -sf /usr/bin/aarch64-linux-gnu-gcc-10 aarch64-linux-android-gcc
          ln -sf /usr/bin/aarch64-linux-gnu-g++-10 aarch64-linux-android-g++
          ln -sf /usr/bin/aarch64-linux-gnu-ld aarch64-linux-android-ld
          ln -sf /usr/bin/aarch64-linux-gnu-ar aarch64-linux-android-ar
          ln -sf /usr/bin/aarch64-linux-gnu-nm aarch64-linux-android-nm
          ln -sf /usr/bin/aarch64-linux-gnu-objcopy aarch64-linux-android-objcopy
          ln -sf /usr/bin/aarch64-linux-gnu-objdump aarch64-linux-android-objdump
          ln -sf /usr/bin/aarch64-linux-gnu-strip aarch64-linux-android-strip
          ln -sf /usr/bin/aarch64-linux-gnu-as aarch64-linux-android-as

          # ARM32
          ln -sf /usr/bin/arm-linux-gnueabihf-gcc-10 arm-linux-androideabi-gcc
          ln -sf /usr/bin/arm-linux-gnueabihf-g++-10 arm-linux-androideabi-g++
          ln -sf /usr/bin/arm-linux-gnueabihf-ld arm-linux-androideabi-ld
          ln -sf /usr/bin/arm-linux-gnueabihf-ar arm-linux-androideabi-ar
          ln -sf /usr/bin/arm-linux-gnueabihf-nm arm-linux-androideabi-nm
          ln -sf /usr/bin/arm-linux-gnueabihf-objcopy arm-linux-androideabi-objcopy
          ln -sf /usr/bin/arm-linux-gnueabihf-objdump arm-linux-androideabi-objdump
          ln -sf /usr/bin/arm-linux-gnueabihf-strip arm-linux-androideabi-strip
          ln -sf /usr/bin/arm-linux-gnueabihf-as arm-linux-androideabi-as

          echo "TOOLCHAIN_PATH=$HOME/toolchain" >> $GITHUB_ENV

      # ─────────────────────────────────────────────
      # 8. VERIFY toolchain
      # ─────────────────────────────────────────────
      - name: Verify toolchain
        run: |
          export PATH=$TOOLCHAIN_PATH/gcc10/bin:$PATH
          echo "=== GCC Version ==="
          aarch64-linux-android-gcc --version | head -n 1
          echo "=== LD Version ==="
          aarch64-linux-android-ld --version | head -n 1
          aarch64-linux-android-gcc --version | grep -q "10." && echo "✓ GCC 10 confirmed" || exit 1

      # ─────────────────────────────────────────────
      # 9. Clone AnyKernel3
      # ─────────────────────────────────────────────
      - name: Setup AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git $HOME/AnyKernel3

      # ─────────────────────────────────────────────
      # 10. Configure kernel with NetHunter options
      # ─────────────────────────────────────────────
      - name: Configure kernel
        run: |
          cd $KERNEL_PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$TOOLCHAIN_PATH/gcc10/bin:$PATH

          if [ "${{ inputs.build_type }}" == "clean" ]; then
            make O=out clean
            make O=out mrproper
          fi

          make O=out ARCH=arm64 ${{ inputs.defconfig }}

          # ── NetHunter Config Fragment ──
          cat << 'EOF' >> out/.config

          # === Core Module Support ===
          CONFIG_MODULES=y
          CONFIG_MODULE_UNLOAD=y
          CONFIG_MODVERSIONS=y
          CONFIG_MODULE_SRCVERSION_ALL=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y

          # === Netfilter / iptables ===
          CONFIG_NETFILTER_XT_TARGET_LOG=y
          CONFIG_NETFILTER_XT_MATCH_MAC=y
          CONFIG_NETFILTER_XT_MATCH_MULTIPORT=y
          CONFIG_NETFILTER_XT_MATCH_OWNER=y
          CONFIG_NETFILTER_XT_MATCH_STATE=y
          CONFIG_NETFILTER_XT_MATCH_LIMIT=y
          CONFIG_NETFILTER_XT_MATCH_COMMENT=y
          CONFIG_NETFILTER_XT_MATCH_STRING=y
          CONFIG_NETFILTER_XT_MATCH_TIME=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NETFILTER_XT_MATCH_HASHLIMIT=y

          # === Wireless Stack ===
          CONFIG_MAC80211=y
          CONFIG_CFG80211=y
          CONFIG_NL80211_TESTMODE=y
          CONFIG_MAC80211_MESH=y
          CONFIG_MAC80211_LEDS=y
          CONFIG_CFG80211_CERTIFICATION_ONUS=y
          CONFIG_CFG80211_CRDA_SUPPORT=y
          CONFIG_CFG80211_WEXT=y

          # === USB Networking ===
          CONFIG_USB_USBNET=m
          CONFIG_USB_NET_CDCETHER=m
          CONFIG_USB_NET_RNDIS_HOST=m
          CONFIG_USB_NET_CDC_NCM=m
          CONFIG_USB_NET_HUAWEI_CDC_NCM=m
          CONFIG_USB_NET_CDC_MBIM=m
          CONFIG_USB_WDM=m

          # === USB Serial (3G/LTE modems) ===
          CONFIG_USB_SERIAL=m
          CONFIG_USB_SERIAL_OPTION=m
          CONFIG_USB_SERIAL_QUALCOMM=m
          CONFIG_USB_SERIAL_WWAN=m
          CONFIG_USB_SERIAL_SIERRAWIRELESS=m

          # === Bluetooth USB ===
          CONFIG_BT_HCIBTUSB=m
          CONFIG_BT_HCIBTUSB_BCM=y
          CONFIG_BT_HCIBTUSB_RTL=y
          CONFIG_BT_HCIBTSDIO=m

          # === USB WiFi — Atheros ===
          CONFIG_ATH_CARDS=m
          CONFIG_ATH9K=m
          CONFIG_ATH9K_COMMON=m
          CONFIG_ATH9K_HW=m
          CONFIG_ATH9K_BTCOEX_SUPPORT=y
          CONFIG_ATH9K_RFKILL=y
          CONFIG_ATH9K_PCOEM=y
          CONFIG_ATH9K_HWRNG=y
          CONFIG_ATH9K_HTC=m

          # === USB WiFi — Realtek ===
          CONFIG_RTL_CARDS=m
          CONFIG_RTLWIFI=m
          CONFIG_RTLWIFI_USB=m
          CONFIG_RTL8192C_COMMON=m
          CONFIG_RTL8187=m
          CONFIG_RTL8192CU=m
          CONFIG_RTL8XXXU=m

          # === USB WiFi — Ralink/Mediatek ===
          CONFIG_RT2X00=m
          CONFIG_RT2X00_LIB=m
          CONFIG_RT2X00_LIB_USB=m
          CONFIG_RT2X00_LIB_FIRMWARE=m
          CONFIG_RT2800_LIB=m
          CONFIG_RT2800_LIB_MMIO=m
          CONFIG_RT2800_LIB_USB=m
          CONFIG_RT2800USB=m
          CONFIG_RT73USB=m
          CONFIG_RT2500USB=m
          CONFIG_CARL9170=m

          # === USB Gadget / HID ===
          CONFIG_USB_HIDDEV=y
          CONFIG_USB_GADGET=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_CONFIGFS_F_MASS_STORAGE=y
          CONFIG_USB_CONFIGFS_F_RNDIS=y
          CONFIG_USB_CONFIGFS_F_ACM=y
          CONFIG_USB_CONFIGFS_F_ECM=y
          CONFIG_USB_CONFIGFS_F_EEM=y
          CONFIG_USB_CONFIGFS_F_SUBSET=y
          CONFIG_USB_CONFIGFS_F_FS=y
          CONFIG_USB_CONFIGFS_F_UVC=y
          CONFIG_USB_CONFIGFS_F_MIDI=y
          CONFIG_USB_CONFIGFS_F_AUDIO_SRC=y
          CONFIG_USB_CONFIGFS_UEVENT=y

          # === RFKILL ===
          CONFIG_RFKILL=y
          CONFIG_RFKILL_INPUT=y
          CONFIG_RFKILL_LEDS=y
          CONFIG_RFKILL_GPIO=y

          # === LEDs ===
          CONFIG_LEDS_CLASS=y
          CONFIG_LEDS_TRIGGERS=y

          # === Diagnostics ===
          CONFIG_PACKET_DIAG=y
          CONFIG_UNIX_DIAG=y
          CONFIG_INET_DIAG=y
          CONFIG_INET_TCP_DIAG=y
          CONFIG_INET_UDP_DIAG=y
          CONFIG_NETLINK_DIAG=y

          # === TUN/TAP ===
          CONFIG_TUN=y
          CONFIG_TAP=y

          # === Traffic Control ===
          CONFIG_NET_SCHED=y
          CONFIG_NET_CLS_U32=y
          CONFIG_NET_EMATCH=y
          CONFIG_NET_CLS_ACT=y
          CONFIG_NET_SCH_HTB=y
          CONFIG_NET_SCH_HFSC=y
          CONFIG_NET_SCH_INGRESS=y
          CONFIG_NET_SCH_NETEM=y

          # === USB Mass Storage ===
          CONFIG_USB_STORAGE=y
          CONFIG_USB_STORAGE_DATAFAB=y
          CONFIG_USB_STORAGE_FREECOM=y
          CONFIG_USB_STORAGE_ISD200=y
          CONFIG_USB_STORAGE_USBAT=y
          CONFIG_USB_STORAGE_SDDR09=y
          CONFIG_USB_STORAGE_SDDR55=y
          CONFIG_USB_STORAGE_JUMPSHOT=y
          CONFIG_USB_STORAGE_ALAUDA=y
          CONFIG_USB_STORAGE_ONETOUCH=y
          CONFIG_USB_STORAGE_KARMA=y
          CONFIG_USB_STORAGE_CYPRESS_ATACB=y
          CONFIG_USB_STORAGE_ENE_UB6250=y

          # === USB Audio / Video ===
          CONFIG_SND_USB_AUDIO=m
          CONFIG_MEDIA_USB_SUPPORT=y
          CONFIG_USB_VIDEO_CLASS=m

          # === Input / Misc ===
          CONFIG_INPUT_UINPUT=y
          CONFIG_BT_RFCOMM=m
          CONFIG_BT_BNEP=m
          CONFIG_BT_HIDP=m
          CONFIG_BT_6LOWPAN=m
          EOF

          sed -i "s/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION=\"${{ inputs.localversion }}\"/" out/.config
          sed -i 's/CONFIG_LOCALVERSION_AUTO=.*/# CONFIG_LOCALVERSION_AUTO is not set/' out/.config
          echo "# CONFIG_LOCALVERSION_AUTO is not set" >> out/.config

          make O=out ARCH=arm64 olddefconfig

          echo "=== Config Verification ==="
          for opt in CONFIG_MODULES CONFIG_USB_GADGET CONFIG_MAC80211 CONFIG_ATH9K_HTC CONFIG_CFG80211; do
            grep -q "^$opt=[ym]" out/.config && echo "✓ $opt" || echo "✗ $opt MISSING"
          done

      # ─────────────────────────────────────────────
      # 11. Build the kernel
      # ─────────────────────────────────────────────
      - name: Build kernel
        run: |
          cd $KERNEL_PATH

          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$TOOLCHAIN_PATH/gcc10/bin:$PATH

          export CC=aarch64-linux-android-gcc
          export CXX=aarch64-linux-android-g++
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export LD=aarch64-linux-android-ld
          export AR=aarch64-linux-android-ar
          export NM=aarch64-linux-android-nm
          export OBJCOPY=aarch64-linux-android-objcopy
          export OBJDUMP=aarch64-linux-android-objdump
          export STRIP=aarch64-linux-android-strip

          export KBUILD_BUILD_USER=NetHunter
          export KBUILD_BUILD_HOST=GitHub-Actions

          echo "=== Starting build ==="
          echo "CC: $(which $CC)"
          $CC --version | head -n 1

          make O=out ARCH=arm64 \
            CC=$CC \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            HOSTCFLAGS="-Wno-deprecated-declarations" \
            -j$(nproc --all) \
            2>&1 | tee build.log

          echo "=== Build outputs ==="
          ls -la out/arch/arm64/boot/ || echo "No boot output directory!"

      # ─────────────────────────────────────────────
      # 12. Package into AnyKernel3 flashable zip
      # ─────────────────────────────────────────────
      - name: Package AnyKernel3
        if: success()
        run: |
          cd $HOME/AnyKernel3
          rm -f Image* zImage* dtbo.img *.ko
          rm -rf modules/

          if [ -f $KERNEL_PATH/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp $KERNEL_PATH/out/arch/arm64/boot/Image.gz-dtb .
            echo "Using Image.gz-dtb"
          elif [ -f $KERNEL_PATH/out/arch/arm64/boot/Image.gz ]; then
            cp $KERNEL_PATH/out/arch/arm64/boot/Image.gz .
            echo "Using Image.gz"
          elif [ -f $KERNEL_PATH/out/arch/arm64/boot/Image ]; then
            cp $KERNEL_PATH/out/arch/arm64/boot/Image .
            echo "Using Image"
          else
            echo "ERROR: No kernel image found!"
            exit 1
          fi

          if [ -f $KERNEL_PATH/out/arch/arm64/boot/dtbo.img ]; then
            cp $KERNEL_PATH/out/arch/arm64/boot/dtbo.img .
          elif [ -f $KERNEL_PATH/out/arch/arm64/boot/dts/qcom/dtbo.img ]; then
            cp $KERNEL_PATH/out/arch/arm64/boot/dts/qcom/dtbo.img .
          fi

          mkdir -p modules
          find $KERNEL_PATH/out -name "*.ko" -exec cp {} modules/ \;
          echo "Collected $(ls modules/*.ko 2>/dev/null | wc -l) modules"

          for mod in modules/*.ko; do
            aarch64-linux-android-strip --strip-unneeded "$mod" 2>/dev/null || true
          done

          cat > anykernel.sh << 'EOF'
          ### AnyKernel setup
          properties() { '
          kernel.string=NetHunter Kernel for Poco X2 (MIUI 12.5.6 / Android 11)
          do.devicecheck=1
          do.modules=1
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=phoenix
          device.name2=phoenixin
          supported.versions=11
          supported.patchlevels=
          '; }

          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          EOF

          ZIP_NAME="NetHunter-PocoX2-A11${{ inputs.localversion }}-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "$ZIP_NAME" * -x .git README.md *placeholder

          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "ZIP_PATH=$HOME/AnyKernel3/$ZIP_NAME" >> $GITHUB_ENV

      # ─────────────────────────────────────────────
      # 13. Upload artifacts
      # ─────────────────────────────────────────────
      - name: Upload kernel zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_id }}
          path: ${{ env.KERNEL_PATH }}/build.log
          if-no-files-found: warn
